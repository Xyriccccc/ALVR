name: Create release

env:
  CARGO_TERM_COLOR: always

on:
  workflow_dispatch:

jobs:
  build_windows_streamer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          override: true

      - uses: crazy-max/ghaction-chocolatey@v1
        with:
          args: install zip unzip pkgconfiglite

      - name: Build and package ALVR
        env:
          RUST_BACKTRACE: 1
        run: |
          cargo xtask package-streamer --gpl --ci
          cargo xtask package-launcher --ci

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v20.14.1-violet --title "ALVR v20.14.1 Violet Mod" --notes "Custom theme: violet accent (#8B5CF6) and pure black background." ./build/alvr_streamer_windows.zip ./build/alvr_launcher_windows.zip